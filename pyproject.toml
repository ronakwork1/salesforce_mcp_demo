[project]
name = "sf-mcp"
version = "0.1.0"
description = "Read-only Salesforce MCP server for looking up Contacts, Cases, Tasks and Events"
requires-python = ">=3.10"
dependencies = ["mcp>=2", "httpx>=0.27", "python-dotenv>=1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
sf-mcp = "sf_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
